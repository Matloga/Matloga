name: Update Tech Stack Cards

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: tech-stack-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stack cards
        env:
          REPOS: "Tsumbedzo_Portfolio jobapp"
        run: |
          for REPO_NAME in $REPOS; do
            OUTPUT="assets/stack-${REPO_NAME}.svg"
            mkdir -p "$(dirname "$OUTPUT")"
            URL="https://stackfingerprint.vercel.app/api/card?repo=${GITHUB_REPOSITORY_OWNER}/${REPO_NAME}&layout=classic&theme=ocean&iconStyle=color&size=md&categoryFilter=all"
            HTTP_CODE=$(curl -sS -w "%{http_code}" -o "$OUTPUT" "$URL")
            echo "${REPO_NAME}: HTTP ${HTTP_CODE} ($(wc -c < "$OUTPUT") bytes)"
            if [ "$HTTP_CODE" -ne 200 ] || ! grep -q "<svg" "$OUTPUT"; then
              echo "::error::Failed to generate card for ${REPO_NAME}"
              cat "$OUTPUT" || true
              rm -f "$OUTPUT"
            fi
          done

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update tech stack cards [skip ci]"
            git push
          fi
